<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
<title id="title">LongHorizon-Harness 整体指导图</title>
<desc id="desc">人给出目标、边界和标准；管理者动态派单，执行者使用现有 Agent 操作，审计者独立验收；账本支持下一轮。结果可为完成、请示、阻塞、停止或达到限制。</desc>
<rect width="1600" height="1340" fill="#f5f3ec"/>
<text x="70" y="55" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" font-weight="700">研究指导图  /  002</text>
<text x="70" y="129" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="51" font-weight="700">LongHorizon-Harness</text>
<text x="70" y="171" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="400">动态拆解复杂目标，指导现有 Agent 分轮执行，以独立验收推动计划持续修正。</text>
<rect x="70" y="207" width="1460" height="80" rx="8" fill="#e7efe8" stroke="#146555" stroke-width="2"/>
<text x="95" y="256" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700">人的起点：明确目标 + 输入资料 + 权限边界 + 验收标准</text>
<text x="70" y="331" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400">固定循环 · 动态任务</text>
<rect x="70" y="353" width="430" height="205" rx="8" fill="#fffef9" stroke="#146555" stroke-width="2"/>
<text x="94" y="405" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="31" font-weight="700">M  管理者</text>
<text x="94" y="436" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">Manager</text>
<text x="94" y="475" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">维护原始要求与任务契约</text>
<text x="94" y="506" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">读取审计证据，判断依赖</text>
<text x="94" y="537" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">选下一步、标准和边界</text>
<rect x="585" y="353" width="430" height="205" rx="8" fill="#fffef9" stroke="#295d94" stroke-width="2"/>
<text x="609" y="405" fill="#295d94" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="31" font-weight="700">E  执行者</text>
<text x="609" y="436" fill="#295d94" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">Executor</text>
<text x="609" y="475" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">每轮使用新的上下文</text>
<text x="609" y="506" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">调用 Codex 等现有 Agent</text>
<text x="609" y="537" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">通过工具完成本轮任务</text>
<rect x="1100" y="353" width="430" height="205" rx="8" fill="#fffef9" stroke="#a44f26" stroke-width="2"/>
<text x="1124" y="405" fill="#a44f26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="31" font-weight="700">A  审计者</text>
<text x="1124" y="436" fill="#a44f26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" font-weight="400">Auditor</text>
<text x="1124" y="475" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">独立检查真实产物与状态</text>
<text x="1124" y="506" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">对照原始要求查漏补缺</text>
<text x="1124" y="537" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">报告完成项、缺失项和证据</text>
<polyline points="500,444 585,444" fill="none" stroke="#146555" stroke-width="4"/>
<polygon points="585,444 572,436 572,452" fill="#146555"/>
<text x="515" y="426" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">派单</text>
<polyline points="1015,444 1100,444" fill="none" stroke="#295d94" stroke-width="4"/>
<polygon points="1100,444 1087,436 1087,452" fill="#295d94"/>
<text x="1027" y="426" fill="#295d94" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">产物</text>
<rect x="70" y="653" width="1460" height="108" rx="8" fill="#e7efe8" stroke="#146555" stroke-width="2"/>
<text x="95" y="702" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" font-weight="700">跨轮进度账本</text>
<text x="370" y="699" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="400">已验证事实与证据  /  未完成要求  /  阻塞原因  /  不可信产物</text>
<text x="370" y="735" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400">Manager 维护，程序保存；审计报告提供可信依据。支持中断后的任务续接。</text>
<polyline points="1315,558 1315,653" fill="none" stroke="#a44f26" stroke-width="4"/>
<polygon points="1315,653 1307,640 1323,640" fill="#a44f26"/>
<text x="1335" y="613" fill="#a44f26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" font-weight="400">记录结果</text>
<polyline points="245,653 245,558" fill="none" stroke="#146555" stroke-width="4"/>
<polygon points="245,558 237,571 253,571" fill="#146555"/>
<text x="265" y="614" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">更新计划，继续下一轮</text>
<text x="70" y="828" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700">自动推进的边界</text>
<rect x="70" y="851" width="460" height="156" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<rect x="560" y="851" width="465" height="156" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<rect x="1055" y="851" width="475" height="156" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<text x="92" y="897" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="26" font-weight="700">什么时候结束？</text>
<text x="92" y="939" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">完成 / 请示用户 / 阻塞或错误</text>
<text x="92" y="975" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">主动停止 / 超时或轮数耗尽</text>
<text x="582" y="896" fill="#295d94" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700">程序管流程，模型作判断</text>
<text x="582" y="939" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">程序：调用、记录、状态检查</text>
<text x="582" y="975" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">模型：拆解、操作选择、验收</text>
<text x="1077" y="896" fill="#a44f26" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700">无需持续盯守 ≠ 保证成功</text>
<text x="1077" y="939" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">关键决定仍可能需要人介入</text>
<text x="1077" y="975" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">记录恢复 ≠ 全环境回滚</text>
<text x="70" y="1072" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" font-weight="700">放到已有产品中理解：能力有重叠，重点各不相同</text>
<rect x="70" y="1097" width="335" height="130" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<text x="90" y="1142" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700">Codex</text>
<text x="90" y="1179" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">直接执行任务</text>
<text x="90" y="1210" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">工具、代码与检查</text>
<rect x="445" y="1097" width="335" height="130" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<text x="465" y="1142" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700">OpenClaw</text>
<text x="465" y="1179" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">随时可联系的助理</text>
<text x="465" y="1210" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">多渠道、会话与自动化</text>
<rect x="820" y="1097" width="335" height="130" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<text x="840" y="1142" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700">Hermes</text>
<text x="840" y="1179" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">积累可复用经验</text>
<text x="840" y="1210" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">记忆、技能与任务执行</text>
<rect x="1195" y="1097" width="335" height="130" rx="8" fill="#fffef9" stroke="#cbd7cf" stroke-width="2"/>
<text x="1215" y="1142" fill="#146555" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" font-weight="700">MetaGPT</text>
<text x="1215" y="1179" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" font-weight="400">组织可定制团队</text>
<text x="1215" y="1210" fill="#52676e" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" font-weight="400">角色、消息与协作流程</text>
<text x="70" y="1279" fill="#152d34" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" font-weight="400">LongHorizon 本身也是多 Agent：它把长任务的分工、验收与可信进度管理组合成固定制度。</text>
