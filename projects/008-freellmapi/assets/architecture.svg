<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">FreeLLMAPI 架构总览</title><desc id="desc">请求路径、模型调度、SQLite 状态与后台维护。原创示意图，非运行截图。</desc>
<rect width="1600" height="1120" fill="#f4f7fb"/>
<text x="70" y="88" font-family="Microsoft YaHei, sans-serif" font-size="46" font-weight="700" fill="#15324f">FreeLLMAPI</text>
<text x="415" y="88" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#15324f">模型接入与调度架构</text>
<text x="70" y="134" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#64748b">研究 005  /  固定提交 83562ad  /  2026-09-10  /  原创示意图，非运行截图</text>
<rect x="70" y="170" width="900" height="100" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="96" y="218" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">01  应用 / 编程 Agent</text>
<text x="96" y="257" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">发送消息、工具定义、模型选择与统一令牌</text>
<rect x="70" y="315" width="900" height="140" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="96" y="363" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">02  统一接口与请求准备</text>
<text x="96" y="402" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">OpenAI 风格 / Anthropic / Gemini / 可选 Ollama</text>
<text x="96" y="436" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">鉴权与校验、格式转换；可选压缩、缓存等处理</text>
<rect x="70" y="480" width="900" height="140" rx="18" fill="#eaf2ff" stroke="#a5c2ef" stroke-width="2"/>
<text x="96" y="528" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#17477f">03  模型路由与密钥选择</text>
<text x="96" y="567" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">先检查工具、视觉、上下文等能力和可用额度</text>
<text x="96" y="601" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">再按可靠性、速度、目录能力等级与余量排序</text>
<rect x="70" y="665" width="900" height="110" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="96" y="713" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">04  供应商适配器 → 云模型 / 本地模型</text>
<text x="96" y="752" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">预留额度、解密密钥、调用上游；可重试失败进入回退</text>
<rect x="70" y="820" width="900" height="115" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="96" y="868" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">05  转换响应并返回客户端</text>
<text x="96" y="907" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">统一流式事件与工具调用格式，记录用量、速度和结果</text>
<path d="M520 270 L520 310" stroke="#64748b" stroke-width="3"/><polygon points="520,310 513,299 527,299" fill="#64748b"/>
<path d="M520 455 L520 475" stroke="#64748b" stroke-width="3"/><polygon points="520,475 513,464 527,464" fill="#64748b"/>
<path d="M520 620 L520 660" stroke="#64748b" stroke-width="3"/><polygon points="520,660 513,649 527,649" fill="#64748b"/>
<path d="M520 775 L520 815" stroke="#64748b" stroke-width="3"/><polygon points="520,815 513,804 527,804" fill="#64748b"/>
<rect x="1030" y="170" width="500" height="140" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="1056" y="218" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">管理入口</text>
<text x="1056" y="257" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">React 管理台 / Electron 桌面壳</text>
<text x="1056" y="291" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">密钥、模型链、Playground、统计</text>
<rect x="1030" y="385" width="500" height="235" rx="18" fill="#eaf2ff" stroke="#a5c2ef" stroke-width="2"/>
<text x="1056" y="433" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#17477f">状态管理</text>
<text x="1056" y="472" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">SQLite + 部分内存状态</text>
<text x="1056" y="506" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">模型与能力 / 加密密钥 / profiles</text>
<text x="1056" y="540" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">请求与 Token 用量 / 冷却状态</text>
<text x="1056" y="574" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">调用表现为后续路由提供反馈</text>
<rect x="1030" y="705" width="500" height="230" rx="18" fill="#ffffff" stroke="#d9e2ee" stroke-width="2"/>
<text x="1056" y="753" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#172f4d">后台维护</text>
<text x="1056" y="792" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">健康检查、冷却探测</text>
<text x="1056" y="826" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">自定义模型同步、备份、唤醒恢复</text>
<text x="1056" y="860" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">签名目录 → 验签 → 事务更新</text>
<text x="1056" y="894" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#334155">目录提供元数据；推理直达模型端</text>
<path d="M1280 310 L1280 377" stroke="#64748b" stroke-width="3"/><polygon points="1280,377 1273,366 1287,366" fill="#64748b"/>
<path d="M1280 700 L1280 629" stroke="#64748b" stroke-width="3"/><polygon points="1280,629 1273,640 1287,640" fill="#64748b"/>
<path d="M1025 550 L978 550" stroke="#64748b" stroke-width="3"/><polygon points="978,550 989,543 989,557" fill="#64748b"/>
<rect x="70" y="980" width="1460" height="95" rx="18" fill="#fff5df" stroke="#e9d3a2" stroke-width="2"/>
<text x="95" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#7d5420">关键边界</text>
<text x="255" y="1023" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#7d5420">调用成功 ≠ 任务正确；流式输出已提交后，不能保证无缝换模型。</text>
<text x="95" y="1061" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#7d5420">图示为理解分层，非独立微服务。尚未接入真实密钥运行；媒体与融合路径的差异见架构正文。</text>
</svg>