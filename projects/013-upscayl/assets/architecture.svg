<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Upscayl：像素变多，信息不一定变真</title><desc id="desc">桌面应用组织任务，模型预测细节，NCNN 与 Vulkan 执行 GPU 推理。专用超分辨率与生成式修复都需检查保真度。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#4a6594" stroke-width="1.5"/></marker><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif}.title{font-size:30px;font-weight:700;fill:#152443}.sub{font-size:18px;fill:#536580}.label{font-size:21px;font-weight:700;fill:#152443}.body{font-size:18px;fill:#344e73}.small{font-size:16px;fill:#536580}.white{fill:white}.line{stroke:#4a6594;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="700" fill="#f7faff"/><text x="40" y="55" class="title">Upscayl 的能力来自哪里？</text><text x="40" y="90" class="sub">应用管理任务 · 模型预测细节 · 框架与硬件执行计算</text>
<rect x="40" y="130" width="255" height="164" rx="8" fill="white" stroke="#cbd8ed"/><text x="60" y="165" class="small">01 / 输入</text><text x="60" y="205" class="label">低清图片 + 处理设置</text><text x="60" y="239" class="body">500 × 500 像素</text><text x="60" y="269" class="body">模型、倍率、输出格式</text><path d="M300 212 H335" class="line"/>
<rect x="345" y="130" width="250" height="164" rx="8" fill="white" stroke="#cbd8ed"/><text x="365" y="165" class="small">02 / 桌面应用</text><text x="365" y="205" class="label">Electron + 界面</text><text x="365" y="239" class="body">文件、任务、进度、预览</text><text x="365" y="269" class="body">启动独立推理程序</text><path d="M600 212 H635" class="line"/>
<rect x="645" y="130" width="250" height="164" rx="8" fill="#eaf0ff" stroke="#a8bee8"/><text x="665" y="165" class="small">03 / 本地推理</text><text x="665" y="205" class="label">NCNN + Vulkan GPU</text><text x="665" y="239" class="body">加载模型，分块计算</text><text x="665" y="269" class="body">拼接、尺寸调整、编码</text><path d="M900 212 H935" class="line"/>
<rect x="945" y="130" width="215" height="164" rx="8" fill="#101c35"/><text x="965" y="165" class="small white">04 / 输出</text><text x="965" y="205" class="label white">更大的图片</text><text x="965" y="239" class="body white">例如 2000 × 2000</text><text x="965" y="269" class="body white">宽高 4×，像素 16×</text>
<rect x="345" y="327" width="550" height="94" rx="8" fill="white" stroke="#cbd8ed"/><text x="365" y="362" class="label">已训练模型：结构 .param + 权重 .bin</text><text x="365" y="397" class="body">学习退化图与高清图的关系；使用时不重新训练</text><path d="M770 326 V303" class="line"/>
<rect x="40" y="460" width="540" height="144" rx="8" fill="white" stroke="#cbd8ed"/><text x="60" y="499" class="label">专用超分辨率</text><text x="60" y="535" class="body">重点：放大、结构保留、批量与计算成本</text><text x="60" y="569" class="body">仍可能出现伪纹理、错误文字和过度锐化</text>
<rect x="600" y="460" width="560" height="144" rx="8" fill="white" stroke="#cbd8ed"/><text x="620" y="499" class="label">生成式修复 / 图像大模型</text><text x="620" y="535" class="body">重点：丰富细节、语义编辑、修复与补全</text><text x="620" y="569" class="body">需约束内容变化，不等于所有模型都自由重绘</text>
<text x="40" y="647" class="label">观感更清楚 ≠ 细节更真实；输出稳定 ≠ 内容正确。</text><text x="40" y="680" class="small">本地原创研究图解 · 2026-09-11 · 非增强效果、软件截图或性能实测</text></svg>
