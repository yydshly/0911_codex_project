<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">从照片到三维：空间估计、场景表示、渲染交付</title><desc id="desc">照片或视频选帧经过传统SfM或预训练几何预测，交给网格、NeRF、3DGS或神经表面路线；生成式三维可以根据参考与先验产生三维资产。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#56829e"/></marker></defs>
<rect width="1200" height="580" rx="16" fill="#0c1c2d"/>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#eef7ff"><text x="44" y="52" font-size="26" font-weight="700">照片提供证据，算法建立空间表示</text><text x="44" y="83" font-size="16" fill="#b7c9da">原创关系示意 · 不是训练结果 · 相机求解与场景表示是不同环节</text></g>
<g fill="none" stroke="#56829e" stroke-width="2" marker-end="url(#arrow)"><path d="M228 242H280"/><path d="M510 242H551V145H598"/><path d="M551 242V236H598"/><path d="M551 242V327H598"/><path d="M551 242V418H598"/><path d="M836 145H892"/><path d="M836 236H892"/><path d="M836 327H892"/><path d="M836 418H892"/></g>
<g fill="#152e46" stroke="#34516b"><rect x="40" y="181" width="188" height="122" rx="8"/><rect x="280" y="155" width="230" height="174" rx="8"/><rect x="598" y="108" width="238" height="74" rx="8"/><rect x="598" y="199" width="238" height="74" rx="8"/><rect x="598" y="290" width="238" height="74" rx="8"/><rect x="598" y="381" width="238" height="74" rx="8"/></g>
<g font-family="Microsoft YaHei,Segoe UI,sans-serif" fill="#edf7ff" font-size="19"><text x="63" y="222">多视角照片</text><text x="63" y="256">或视频选帧</text><text x="306" y="194">相机与空间估计</text><text x="306" y="236" font-size="17">传统 SfM / COLMAP</text><text x="306" y="269" font-size="17">或 VGGT 等几何预测</text><text x="306" y="302" font-size="15" fill="#b7c9da">也可利用传感器信息</text><text x="620" y="152">MVS / 表面重建</text><text x="620" y="243">NeRF / 辐射场</text><text x="620" y="334" fill="#62dfd5">3DGS / 三维高斯</text><text x="620" y="425">神经隐式表面</text><text x="912" y="152">网格与纹理</text><text x="912" y="243">体渲染 / 新视角</text><text x="912" y="334" fill="#62dfd5">高斯投影 / 新视角</text><text x="912" y="425">表面提取 / 网格</text></g>
<path d="M44 493H1156" stroke="#34516b"/><g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="44" y="526" font-size="18" fill="#ffd183">另一种来源：图片 / 文字 + 生成先验 → 生成三维结构 → 可解码为网格、高斯等</text><text x="44" y="555" font-size="16" fill="#b7c9da">输出格式不等于生成算法；能旋转不等于精确测量。不同路线可以融合，效果取决于数据与约束。</text></g></svg>
