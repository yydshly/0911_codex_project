<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2440" viewBox="0 0 1920 2440" role="img" aria-labelledby="title desc">
<title id="title">Munder Difflin：核心能力、协作原理与同类差异总览</title><desc id="desc">中文原创研究图。说明本地多 CLI 管理、文件队列和空闲终端唤醒，与 Multica、MetaGPT、LongHorizon、Pi/OMP、Memmy 比较，并记录场景、按需扩展与未实测边界。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#137F7C"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
