name: Publish research demos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/build-pages.cjs'
      - 'docs/web-demos.json'
      - 'projects/002-engineering-casebook/app/**'
      - 'projects/002-engineering-casebook/sources/**'
      - 'projects/002-engineering-casebook/assets/overview-guide.png'
      - 'projects/003-longhorizon-harness/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Generate and check casebook
        working-directory: projects/002-engineering-casebook/app
        run: |
          node scripts/build-data.cjs
          node scripts/check.cjs
          git diff --exit-code -- dist/data.js ../cases.md
      - name: Assemble project demos
        run: node scripts/build-pages.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
