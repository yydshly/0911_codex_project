name: Publish research demos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/build-pages.cjs'
      - 'docs/web-demos.json'
      - 'projects/002-engineering-casebook/app/**'
      - 'projects/002-engineering-casebook/sources/**'
      - 'projects/002-engineering-casebook/assets/overview-guide.png'
      - 'projects/003-longhorizon-harness/**'
      - 'projects/005-xxg-portrait-rebuild-light/**'
      - 'projects/006-drama-skills/**'
      - 'projects/007-xxd-panel-028/**'
      - 'projects/008-freellmapi/**'
      - 'projects/009-graphify/**'
      - 'projects/011-munder-difflin/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Python for FreeLLMAPI reading pages
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check FreeLLMAPI understanding site
        run: |
          python -m pip install -r projects/008-freellmapi/app/requirements.txt
          python projects/008-freellmapi/app/build.py
          node projects/008-freellmapi/app/check.cjs
      - name: Generate and check casebook
        working-directory: projects/002-engineering-casebook/app
        run: |
          node scripts/build-data.cjs
          node scripts/check.cjs
          git diff --exit-code -- dist/data.js ../cases.md
      - name: Build and check portrait showcase
        run: node projects/005-xxg-portrait-rebuild-light/app/scripts/build.cjs
      - name: Build and check XXD Panel
        run: |
          node projects/007-xxd-panel-028/app/scripts/check-real-demos.cjs
          node projects/007-xxd-panel-028/app/scripts/build.cjs
          node projects/007-xxd-panel-028/app/scripts/check.cjs
      - name: Build and check Drama Skills showcase
        run: |
          node projects/006-drama-skills/app/build.cjs
          node projects/006-drama-skills/app/check.cjs
      - name: Build and check Munder Difflin
        run: |
          python -m pip install -r projects/011-munder-difflin/app/requirements.txt
          python projects/011-munder-difflin/app/build.py
          node projects/011-munder-difflin/app/check.cjs
      - name: Check Graphify showcase
        run: |
          node projects/009-graphify/app/check.cjs
          node projects/009-graphify/app/check-native.cjs
      - name: Assemble project demos
        run: node scripts/build-pages.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
